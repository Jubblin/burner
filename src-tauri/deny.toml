[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error: unmaintained, build-time only, pulled in by Tauri's macro stack; no safe upgrade path here
  "RUSTSEC-2024-0370",
  # zip 4.6.1 comes from tauri-plugin-updater (our own zip 9 is patched); it only extracts update archives verified against our signing key. Drop once the plugin bumps zip
  "RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369",
  # zbus/zvariant: unmaintained, Linux-only via Tauri's dbus stack; no upgrade path from this repo
  "RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "MPL-2.0",
  "Unicode-3.0", "Unlicense", "Zlib",
]

[licenses.private]
ignore = true # the unpublished `burner` crate itself has no license field

[bans]
multiple-versions = "warn" # Tauri's tree pulls many duplicates we cannot control
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
